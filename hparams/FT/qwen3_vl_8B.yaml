# Model
device: "cuda"

name: Qwen/Qwen3-VL-8B-Instruct
model_name: Qwen/Qwen3-VL-8B-Instruct
model_class: Qwen3VLForConditionalGeneration
tokenizer_class: Qwen3VLProcessor
tokenizer_name: Qwen/Qwen3-VL-8B-Instruct
rewrite_module_tmp: "model.language_model.layers.{}.mlp.down_proj.weight"

# Method
alg_name: FT
edit_lr: 1e-4
layers: [35]
num_steps: 25
weight_decay: 0
kl_factor: 0
norm_constraint: 5.0

cedit: 0.1
iedit: 0.1
cloc: 1.0
cbase: 1.0
train_base: True
archive: null
init_std: 0.02
dtype: bfloat16
# Train
batch_size: 1
model_save_pt: 100
silent: False
#max_epochs: 1
log_interval: 50
eval_log_interval: 100
final_eval: True
freeze_language_model: True
freeze_vision_encoder: True
freeze_projector: True
dropout: 0.0
val_interval: 100
early_stop_patience: 5
early_stop_key: "loss/total_edit_val"
eval_only: True
half: False
debug: False
save: False
verbose: True

val_batch_size: 1
accumulate_bs: 2
val_steps: 500 # only for debug
opt: Adam
grad_clip: 10.
seed: 42

# Output
results_root_dir: ./results

objective_optimization: "target_new"
# Multimodal
exact_match: True
state_dict_file: .
# image
coco_image: ../
rephrase_image: ../
