alg_name: "WISE"
name: google/gemma-3-12b-it
model_name: google/gemma-3-12b-it
model_class: Gemma3ForConditionalGeneration
tokenizer_class: AutoProcessor
tokenizer_name: google/gemma-3-12b-it
rewrite_module_tmp: "model.language_model.layers[{}].mlp.down_proj.weight"

device: 0
results_root_dir: "./results"
dtype: bfloat16
task_name: "crope"

# Experiments
test_generation: False
mask_ratio: 0.2
edit_lr: 0.9
layers: [43]
# n_iter: 70
n_iter: 20
norm_constraint: 1.0
act_margin: [25.0, 60.0, 30.0] # alpha, beta, gamma
act_ratio: 0.4
# act_ratio: 0.88
save_freq: 20
merge_freq: 1000
merge_alg: 'ties'
objective_optimization: 'only_label'

## alternative: WISE-Merge, WISE-Retrieve
# for merge (if merge)
densities: 0.53
weights: 1.0

# for retrieve (if retrieve, pls set to True)
retrieve: True
replay: False # True --> will replay the past editing instances: see https://arxiv.org/abs/2405.14768 Appendix B.3

model_parallel: False
use_chat_template: True

# Multimodal
exact_match: True
hidden_act: silu
qformer_checkpoint: .
qformer_name_or_path: .
state_dict_file: .
pretrained_ckpt: .
# image
file_type: image
coco_image: ../
rephrase_image: ../
