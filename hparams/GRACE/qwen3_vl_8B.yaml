alg_name: "GRACE"
name: Qwen/Qwen3-VL-8B-Instruct
model_name: ".Qwen/Qwen3-VL-8B-Instruct"
model_class: Qwen3VLForConditionalGeneration
tokenizer_class: Qwen3VLProcessor
tokenizer_name: Qwen/Qwen3-VL-8B-Instruct
rewrite_module_tmp: "model.language_model.layers[{}].mlp.down_proj.weight"

device: 0
results_root_dir: "./results"
dtype: bfloat16
task_name: "crope"
test_generation: False
exact_match: True

edit_lr: 1.0
layers: [28]
# n_iter: 200
n_iter: 20
eps: 1.0
dist_fn: euc # euc, mmd, cos
val_init: cold # cold, warm
val_train: sgd # sgd, pert
val_reg: None # early
reg: early_stop # early_stop
replacement: replace_last # replace_last, replace_all, replace_prompt
eps_expand: coverage # , moving_avg, decay
num_pert: 8 # only matters when using perturbation training
dropout: 0.0
